<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="256" height="512"/>
    </clipPath>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="#F2EFE6"/>

    <!-- full dog: paper fill with ink outline so the light half reads on light ground -->
    <g fill="#F2EFE6" stroke="#15171C" stroke-width="14" stroke-linejoin="round">
      <path d="M150,196 L196,96 L240,184 Z"/>
      <path d="M272,184 L316,96 L362,196 Z"/>
      <path d="M170,184 Q256,152 342,184 Q362,262 330,332 Q302,392 256,400 Q210,392 182,332 Q150,262 170,184 Z"/>
    </g>
    <!-- left half inked -->
    <g clip-path="url(#leftHalf)" fill="#15171C">
      <path d="M150,196 L196,96 L240,184 Z"/>
      <path d="M272,184 L316,96 L362,196 Z"/>
      <path d="M170,184 Q256,152 342,184 Q362,262 330,332 Q302,392 256,400 Q210,392 182,332 Q150,262 170,184 Z"/>
    </g>

    <!-- eyes: terminal cursor blocks -->
    <rect x="199" y="238" width="22" height="32" rx="6" fill="#F2EFE6"/>
    <rect x="291" y="238" width="22" height="32" rx="6" fill="#15171C"/>

    <!-- nose: whistle orange, centered on the split -->
    <path d="M231,362 Q256,353 281,362 Q274,392 256,395 Q238,392 231,362 Z" fill="#ED8B33"/>

    <!-- collar with cursor tag -->
    <path d="M182,406 Q256,446 330,406 L330,436 Q256,478 182,436 Z" fill="#ED8B33"/>
    <rect x="246" y="430" width="20" height="20" rx="4" fill="#15171C"/>
  </g>
</svg>
