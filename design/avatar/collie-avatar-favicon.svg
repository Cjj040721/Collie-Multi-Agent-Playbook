<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rightHalf">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="#33404E"/>

    <!-- ears -->
    <path d="M150,196 L196,96 L240,184 Z" fill="#15171C" stroke="#15171C" stroke-width="28" stroke-linejoin="round"/>
    <path d="M272,184 L316,96 L362,196 Z" fill="#F2EFE6" stroke="#F2EFE6" stroke-width="28" stroke-linejoin="round"/>

    <!-- head: dark left half -->
    <path d="M170,184 Q256,152 342,184 Q362,262 330,332 Q302,392 256,400 Q210,392 182,332 Q150,262 170,184 Z"
          fill="#15171C"/>
    <!-- head: paper right half -->
    <g clip-path="url(#rightHalf)">
      <path d="M170,184 Q256,152 342,184 Q362,262 330,332 Q302,392 256,400 Q210,392 182,332 Q150,262 170,184 Z"
            fill="#F2EFE6"/>
    </g>

    <!-- eyes: enlarged cursor blocks for small sizes -->
    <rect x="194" y="232" width="28" height="40" rx="7" fill="#F2EFE6"/>
    <rect x="290" y="232" width="28" height="40" rx="7" fill="#15171C"/>

    <!-- nose: enlarged -->
    <path d="M226,358 Q256,347 286,358 Q278,394 256,398 Q234,394 226,358 Z" fill="#ED8B33"/>

    <!-- collar, tag removed -->
    <path d="M182,406 Q256,446 330,406 L330,436 Q256,478 182,436 Z" fill="#ED8B33"/>
  </g>
</svg>
