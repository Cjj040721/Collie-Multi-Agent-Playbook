<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rightHalf">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="#12141A"/>

    <!-- ears -->
    <path d="M150,196 L196,96 L240,184 Z" fill="#2A2F38" stroke="#2A2F38" stroke-width="28" stroke-linejoin="round"/>
    <path d="M272,184 L316,96 L362,196 Z" fill="#F2EFE6" stroke="#F2EFE6" stroke-width="28" stroke-linejoin="round"/>

    <!-- head: dark left half (lifted off the ink ground) -->
    <path d="M170,184 Q256,152 342,184 Q362,262 330,332 Q302,392 256,400 Q210,392 182,332 Q150,262 170,184 Z"
          fill="#2A2F38"/>
    <!-- head: paper right half -->
    <g clip-path="url(#rightHalf)">
      <path d="M170,184 Q256,152 342,184 Q362,262 330,332 Q302,392 256,400 Q210,392 182,332 Q150,262 170,184 Z"
            fill="#F2EFE6"/>
    </g>

    <!-- eyes: terminal cursor blocks -->
    <rect x="199" y="238" width="22" height="32" rx="6" fill="#F2EFE6"/>
    <rect x="291" y="238" width="22" height="32" rx="6" fill="#12141A"/>

    <!-- nose: whistle orange, centered on the split -->
    <path d="M231,362 Q256,353 281,362 Q274,392 256,395 Q238,392 231,362 Z" fill="#ED8B33"/>

    <!-- collar with cursor tag -->
    <path d="M182,406 Q256,446 330,406 L330,436 Q256,478 182,436 Z" fill="#ED8B33"/>
    <rect x="246" y="430" width="20" height="20" rx="4" fill="#12141A"/>
  </g>
</svg>
